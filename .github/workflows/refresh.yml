name: Refresh data

# Wakes every hour; refreshes at 00:00, 06:00, 12:00 and 18:00 Berlin time, and catches up by itself when GitHub
# skipped a run (scripts/should_run.py). Everything here is free and needs no keys:
#   safety.py  official pages per country (only used for the official entry-information links)  every refresh
#   rates.py   exchange rates (ECB via Frankfurter, ExchangeRate-API)                  every refresh
#   facts.py   plugs, voltage, driving side, languages... (Wikidata, IANA)           once a day
#   visa.py    visa rules per passport (Wikipedia, Passport Index dataset)           once a day
#   places.py  cities, must-sees, hidden spots (Wikivoyage, Wikidata)              20 countries per refresh
# A source that fails keeps its last good data. Cloudflare Pages republishes the site after every data commit.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:          # "Run workflow" button for a refresh right now

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Is a refresh due?
        id: due
        run: python scripts/should_run.py

      - if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Official travel advice
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/safety.py

      - name: Exchange rates
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/rates.py

      - name: Country facts (once a day)
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/facts.py

      - name: Visa rules (once a day)
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/visa.py

      - name: City guides (Wikivoyage, the 20 oldest countries each time, so every country about weekly)
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/places.py --max=20

      - name: Commit updated data
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "atlasroam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          # someone may have pushed meanwhile: replay the data commit on top and retry
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "push failed (attempt $attempt), retrying"; sleep 10
          done
          exit 1
